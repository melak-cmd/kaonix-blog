name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://melak-cmd.github.io
  PUBLIC_BASE_PATH: /kaonix-blog

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Smoke test build output
        run: |
          test -f dist/index.html || { echo "FAIL: index.html missing"; exit 1; }
          test -f dist/rss.xml || { echo "FAIL: rss.xml missing"; exit 1; }
          test -d dist/blog || { echo "FAIL: blog dir missing"; exit 1; }
          test -d dist/categories/tutorials || { echo "FAIL: categories missing"; exit 1; }
          grep -q "Kaonix" dist/index.html || { echo "FAIL: brand check"; exit 1; }
          echo "Build output OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
